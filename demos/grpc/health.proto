// The standard gRPC health-checking contract, kept here for the demo only.
//
// It is not part of redb.Identity's published contract — the facade serves the address, but the schema
// belongs to gRPC itself (grpc/grpc-proto). grpcurl needs a schema to call an address when the server
// does not serve reflection, so this file exists to give it one.
//
// Source: https://github.com/grpc/grpc-proto/blob/master/grpc/health/v1/health.proto

syntax = "proto3";

package grpc.health.v1;

service Health {
  rpc Check (HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }
  ServingStatus status = 1;
}
